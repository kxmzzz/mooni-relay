# Render Blueprint — เชื่อม repo นี้แล้ว Render จะตั้งค่าเองทั้งหมด
services:
  - type: web
    name: mooni-relay
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ADMIN_KEY
        generateValue: true   # Render จะสุ่มรหัสให้ ดู/คัดลอกได้ในหน้า Environment
      - key: AUTH_SECRET
        generateValue: true   # คีย์เซ็นบัตรผ่าน Discord (Render สุ่มให้)
      # ---- ล็อกอิน Discord (ยศ Mooni) — ใส่ค่าเองในหน้า Environment ----
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: DISCORD_ROLE_ID
        sync: false
      - key: DISCORD_GUILD2_ID
        value: '1549377539431206962'   # ดิสที่สอง — มียศด้านล่างในดิสนี้ = ใช้แอปได้ถาวรทุกอย่าง
      - key: DISCORD_ROLE2_ID
        value: '1550085695110914089'   # ยศในดิสที่สอง (สิทธิ์ถาวร ปลดล็อกทุกหน้า/ทุกแมพ)
      - key: DISCORD_PRIME_ROLE_ID
        sync: false
      - key: DISCORD_MC_ROLE_ID
        sync: false
      - key: DISCORD_CANDY_ROLE_ID
        sync: false
      - key: DISCORD_FARMER_ROLE_ID
        sync: false
      - key: DISCORD_PARKOUR_ROLE_ID
        value: '1550867888531968170'   # ยศ Parkour V1 (ปลดล็อกการ์ดแมพพาร์คคอร์)
      - key: DISCORD_SPEEDRUN_ROLE_ID
        value: '1551020999070322698'   # ยศ Diamond Speedrun (ปลดล็อกการ์ด Diamond Speedrun)
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_PUBLIC_KEY
        sync: false
      # ---- เก็บวันหมดอายุถาวร (Upstash Redis ฟรี) ----
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # ---- ตรวจสลิปอัตโนมัติ (EasySlip) ----
      - key: EASYSLIP_TOKEN
        sync: false
      - key: DISCORD_INVITE
        sync: false

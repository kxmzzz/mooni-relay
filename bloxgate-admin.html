<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bloxgate · Roblox access</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f7f5ff;font:15px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1100px;margin:auto;padding:48px 24px}h1{margin:8px 0;font-size:38px}.eyebrow{color:#b8a5ff;font-weight:700;letter-spacing:.18em;text-transform:uppercase}.muted{color:#a6abc0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;margin-top:28px}.card,.panel{border:1px solid #28304b;border-radius:22px;background:#151b2e;overflow:hidden}.card{cursor:pointer;text-align:left;color:inherit;padding:0;transition:.18s}.card:hover{transform:translateY(-3px);border-color:#a98bff}.cover{width:100%;height:150px;object-fit:cover;background:#282448}.placeholder{height:150px;display:grid;place-items:center;font-size:44px;background:#282448}.body{padding:18px}.open{float:right;color:#c9bcff}.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.panel{padding:22px;margin-top:22px}.player{display:flex;gap:14px;align-items:center;border:1px solid #28304b;border-radius:16px;padding:12px;margin-top:10px;flex-wrap:wrap}.avatar{width:52px;height:52px;border-radius:14px;object-fit:cover;background:#33285c}.grow{flex:1;min-width:150px}.pill{padding:7px 10px;border-radius:9px;background:#212a42}.danger{border-color:#ff668b;color:#ffd5e0}button,input{font:inherit}button{cursor:pointer}.btn{border:0;border-radius:11px;padding:11px 14px;background:#8d52ff;color:white;font-weight:700}.btn.secondary{background:#242b43}.btn.danger{background:transparent;border:1px solid #ff668b}input{border:1px solid #303952;border-radius:11px;background:#0d1324;color:white;padding:11px;min-width:190px}.hidden{display:none}.error{color:#ffb8c8;margin-top:14px}.back{background:none;border:0;color:#c9bcff;padding:0}.empty{padding:48px;text-align:center;border:1px dashed #4d4273;border-radius:18px;color:#a6abc0;margin-top:22px}@media(max-width:600px){.wrap{padding:28px 16px}h1{font-size:30px}}
</style></head><body><main class="wrap"><section id="login" class="panel" style="max-width:440px;margin:10vh auto"><div class="eyebrow">Mooni</div><h1>เข้าสู่ระบบไวริส</h1><p class="muted">Mooni Shop</p><form onsubmit="login(event)"><input id="loginUser" value="Mooni" placeholder="ชื่อผู้ใช้"><input id="loginPassword" type="password" placeholder="รหัสผ่าน" style="margin-top:12px"><button class="btn" type="submit">เข้าสู่ระบบ</button><div id="loginError" class="error"></div></form></section><section id="app" class="hidden"><div id="home"><div class="eyebrow">Bloxgate</div><h1>Roblox access control</h1><p class="muted">เกมจะปรากฏอัตโนมัติเมื่อ Bloxgate Script เชื่อมต่อ</p><div id="error" class="error"></div><div id="maps" class="grid"></div></div><div id="detail" class="hidden"><button class="back" onclick="showHome()">← กลับไปเกมที่เชื่อมต่อ</button><h1 id="mapName"></h1><p class="muted">จัดการไวริสของแมพนี้</p><section class="panel"><div class="row"><input id="username" placeholder="Roblox username"><button class="btn secondary" id="timed" onclick="duration=false">30 วัน</button><button class="btn secondary" id="permanent" onclick="duration=true">ถาวร</button><button class="btn" onclick="addGrant()">เพิ่มชื่อ</button></div><div id="detailError" class="error"></div></section><section class="panel"><h2>Player access</h2><div id="grants"></div></section></div></section></main><script>
let selected=null,duration=false;const $=id=>document.getElementById(id);const api=(path,opt={})=>fetch(path,{credentials:'same-origin',...opt}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d});
async function login(event){event.preventDefault();try{await api('/api/bloxgate/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('loginUser').value,password:$('loginPassword').value})});$('login').classList.add('hidden');$('app').classList.remove('hidden');loadMaps()}catch(e){$('loginError').textContent=e.message}}
function esc(v){const e=document.createElement('span');e.textContent=v||'';return e.innerHTML}function expiry(days){const d=new Date;d.setDate(d.getDate()+days);return d.toISOString()}
async function loadMaps(){try{const d=await api('/api/roblox/maps');$('maps').innerHTML=d.maps.length?d.maps.map(m=>`<button class="card" onclick='openMap(${JSON.stringify(m).replace(/'/g,"&#39;")})'>${m.iconUrl?`<img class="cover" src="${esc(m.iconUrl)}">`:'<div class="placeholder">🎮</div>'}<div class="body"><span class="open">เปิด →</span><h2>${esc(m.name)}</h2><div class="muted">Place ID: ${esc(m.placeId)}</div></div></button>`).join(''):'<div class="empty">ยังไม่มีเกมเชื่อมต่อ ให้เปิด Play ใน Roblox Studio</div>'}catch(e){$('error').textContent=e.message}}
async function openMap(map){selected=map;$('home').classList.add('hidden');$('detail').classList.remove('hidden');$('mapName').textContent=map.name;await loadGrants()}function showHome(){$('detail').classList.add('hidden');$('home').classList.remove('hidden');selected=null;loadMaps()}
async function loadGrants(){if(!selected)return;try{const d=await api('/api/roblox/grants?placeId='+encodeURIComponent(selected.placeId));$('grants').innerHTML=d.grants.length?d.grants.map(g=>`<div class="player">${g.avatarUrl?`<img class="avatar" src="${esc(g.avatarUrl)}">`:'<div class="avatar"></div>'}<div class="grow"><b>${esc(g.displayName)}</b><div class="muted">@${esc(g.username)}</div></div><span class="pill">${g.isPermanent?'ถาวร':('เหลือ '+Math.max(0,Math.ceil((Date.parse(g.expiresAt)-Date.now())/86400000))+' วัน')}</span><button class="btn danger" onclick="removeGrant(${Number(g.robloxUserId||g.id)})">ลบ</button></div>`).join(''):'<div class="empty">ยังไม่มีรายชื่อ</div>'}catch(e){$('detailError').textContent=e.message}}
async function addGrant(){try{const username=$('username').value.trim();if(!username)throw Error('กรอกชื่อ Roblox ก่อน');await api('/api/roblox/grants?placeId='+encodeURIComponent(selected.placeId),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,isPermanent:duration,expiresAt:duration?null:expiry(30)})});$('username').value='';await loadGrants()}catch(e){$('detailError').textContent=e.message}}
async function removeGrant(userId){if(!confirm('ลบสิทธิ์นี้?'))return;try{await api('/api/roblox/grants?placeId='+encodeURIComponent(selected.placeId)+'&userId='+userId,{method:'DELETE'});await loadGrants()}catch(e){$('detailError').textContent=e.message}}
setInterval(()=>{if(!$('app').classList.contains('hidden')){if(selected)loadGrants();else loadMaps()}},5000);
</script></body></html>
